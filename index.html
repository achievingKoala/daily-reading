<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f5ef" />
  <title>翻书 · 用一段文字遇见一本好书</title>
  <style>
    :root{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#262922;background:#f7f5ef;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 48% -30%,#f0ebdc 2%,transparent 63%),#f7f5ef}
    button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #b49a73;outline-offset:3px}
    .site{max-width:1120px;margin:auto;padding:30px 32px 40px}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:10px;font-family:Georgia,"Songti SC",serif;font-size:25px;font-weight:800;letter-spacing:2px}.mark{display:grid;place-items:center;width:34px;height:34px;color:white;background:#344d41;border-radius:10px;font-size:21px}
    .top-note{font-size:13px;color:#87877e}.top-note span{color:#426a55;font-weight:700}
    main{display:flex;flex-direction:column;align-items:center;margin-top:47px}
    .eyebrow{font-size:12px;letter-spacing:4px;color:#869084;font-weight:700}.hero{font-family:Georgia,"Songti SC",serif;font-size:clamp(25px,3.3vw,39px);letter-spacing:1px;font-weight:600;margin:13px 0 12px;text-align:center}.subtitle{font-size:14px;color:#918d82;margin:0 0 34px;text-align:center;line-height:1.8}
    .card{background:#fffefb;border:1px solid #e7e3d9;box-shadow:0 22px 55px #584d3020,0 2px 6px #453b2707;border-radius:17px;width:min(100%,650px);min-height:470px;padding:35px 45px 29px;position:relative;overflow:hidden;display:flex;flex-direction:column;transition:opacity .17s,transform .17s}
    .card.swap{opacity:.35;transform:translateY(7px)}.card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:#365d49}
    .card-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.tag{font-size:12px;color:#4d755e;background:#ecf3eb;border-radius:99px;padding:7px 12px;font-weight:600}.count{color:#aaa89f;font-size:12px;font-variant-numeric:tabular-nums}
    h2{font-family:Georgia,"Songti SC",serif;font-weight:700;letter-spacing:.3px;font-size:clamp(25px,3vw,31px);line-height:1.52;margin:27px 0 20px}.rule{width:33px;height:3px;background:#d0ac6f;border-radius:3px;margin-bottom:23px}
    .passage{font-family:Georgia,"Songti SC",serif;font-size:17px;line-height:2.1;margin:0;color:#45463f}.section-label{font-size:11px;letter-spacing:2px;color:#aaa395;margin:25px 0 10px;font-weight:700}.summary{font-size:14px;line-height:1.9;color:#76776e;margin:0}
    .attribution{margin-top:auto;padding-top:27px;color:#aaa69b;font-size:11px}
    .reveal{margin-top:24px;border-top:1px solid #eae8df;padding-top:21px;animation:appear .24s ease-out}.reveal[hidden]{display:none}.reveal-label{font-size:12px;color:#8c8b7f;margin-bottom:12px}.book-info{display:flex;gap:17px;align-items:center}.cover{flex:none;background:linear-gradient(145deg,#466855,#253e35);color:#f7efdc;width:72px;height:97px;border-radius:3px 7px 7px 3px;display:grid;place-items:center;box-shadow:3px 4px 9px #0002;border-left:5px solid #24382c}.cover svg{width:27px;height:27px}.book-info h3{font-family:Georgia,"Songti SC",serif;font-size:18px;margin:0 0 5px}.author{font-size:12px;color:#98978e;margin:0 0 8px}.book-desc{font-size:13px;color:#74766e;line-height:1.65;margin:0}.read-link{display:inline-flex;justify-content:center;align-items:center;gap:7px;margin-top:18px;padding:12px 17px;border-radius:9px;background:#355943;color:#fff;text-decoration:none;font-size:13px;font-weight:600}.read-link:hover{background:#274532}
    .actions{display:flex;gap:13px;margin-top:24px;width:min(100%,650px)}.btn{border:1px solid #dedbd0;border-radius:12px;padding:15px 16px;background:#fffdfa;color:#58594f;display:flex;align-items:center;justify-content:center;gap:11px;font-size:14px;font-weight:650;flex:1;box-shadow:0 2px 5px #00000005;transition:transform .15s,background .15s}.btn:hover{transform:translateY(-2px)}.btn.primary{background:#355943;color:white;border-color:#355943}.btn.primary:hover{background:#294935}.btn.primary[disabled]{opacity:.7;cursor:default;transform:none}.btn svg{width:18px;height:18px}
    .footer-row{width:min(100%,650px);display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:21px;font-size:12px;color:#a7a398}.progress{display:flex;align-items:center;gap:7px}.dot{width:5px;height:5px;border-radius:50%;background:#d6d5cb}.dot.active{background:#4e775c;width:15px;border-radius:8px}.save{background:transparent;border:0;color:#8f9084;padding:5px 0;display:flex;align-items:center;gap:5px;font-size:12px}.save[aria-pressed="true"]{color:#355943;font-weight:700}
    .note{font-size:11px;line-height:1.6;max-width:650px;color:#a19f96;text-align:center;margin-top:35px}svg{vertical-align:middle}@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @media(max-width:600px){.site{padding:20px 17px 30px}main{margin-top:42px}.top-note{font-size:11px}.hero{margin-top:12px}.subtitle{margin-bottom:26px}.card{padding:27px 23px 25px;min-height:470px}h2{margin-top:23px;font-size:25px}.passage{font-size:16px}.actions{gap:10px}.btn{font-size:13px;padding:15px 8px}.note{margin-top:22px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<div class="site">
  <header>
    <div class="brand"><span class="mark" aria-hidden="true">书</span> 翻书</div>
    <div class="top-note">读一段好文字，<span>遇见一本好书。</span></div>
  </header>
  <main>
    <div class="eyebrow">DISCOVER YOUR NEXT BOOK</div>
    <h1 class="hero">下一本喜欢的书，藏在下一张卡片里。</h1>
    <p class="subtitle">不必从书名开始。先读一段文字，再决定要不要走进这本书。</p>
    <article class="card" id="card" aria-live="polite" aria-atomic="true">
      <div class="card-top"><span class="tag" id="tag"></span><span class="count" id="count"></span></div>
      <h2 id="title"></h2><div class="rule"></div>
      <p class="passage" id="passage"></p>
      <div class="section-label">这段文字想说什么</div><p class="summary" id="summary"></p>
      <section class="reveal" id="reveal" hidden>
        <div class="reveal-label">你刚刚发现了一本书</div>
        <div class="book-info"><div class="cover" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 6.5c-3-2-6.5-2-10-1v13c3.5-1 7-1 10 1 3-2 6.5-2 10-1v-13c-3.5-1-7-1-10 1zm0 0v13"/></svg></div><div><h3 id="book-title"></h3><p class="author" id="author"></p><p class="book-desc" id="book-desc"></p></div></div>
        <a id="read-link" class="read-link" href="#" target="_blank" rel="noopener noreferrer">查找原书与阅读渠道 <span aria-hidden="true">↗</span></a>
      </section>
      <div class="attribution">✧ 本站卡片为原创内容概括，并非原书逐字摘录</div>
    </article>
    <div class="actions">
      <button class="btn" id="skip" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 7v5h-5"/><path d="M4.9 9a8 8 0 0 1 13.4-2L20 12M4 17v-5h5"/><path d="M19.1 15a8 8 0 0 1-13.4 2L4 12"/></svg>不感兴趣，换一张</button>
      <button class="btn primary" id="like" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg>感兴趣，看看是什么书</button>
    </div>
    <div class="footer-row"><span id="viewed">已探索 1 张卡片</span><span class="progress" id="progress" aria-label="卡片位置"></span><button class="save" id="save" type="button" aria-pressed="false">♡ 收藏这张卡片 <span id="saved-count"></span></button></div>
    <p class="note">演示版本：书籍推荐链接为公开搜索结果，并不保证有免费全文。正式上线时建议接入正版试读或出版方授权链接。</p>
  </main>
</div>
<script>
  const books = [
    {tag:"心理学 · 决策",title:"为什么我们总是对失去的东西念念不忘？",passage:"丢失一百元带来的难过，常常超过意外得到一百元的快乐。我们并不是用同一把尺子衡量收益和损失，这种不对称会悄悄改变购物、投资和日常生活里的决定。",summary:"所谓“损失厌恶”，解释了为什么人们有时宁愿守住已有的东西，也不愿尝试可能更好的机会。",book:"思考，快与慢",author:"丹尼尔·卡尼曼",desc:"从心理学实验出发，认识直觉、判断与认知偏差。"},
    {tag:"财富 · 创业",title:"为什么努力工作，并不一定能让人变得富有？",passage:"如果收入永远等于工作时长乘以时薪，那么一天只有二十四小时，就会成为无法突破的边界。创造一件能够重复被使用的产品，也许会改变价值与时间之间的关系。",summary:"借助代码、产品、资本和传播等杠杆，让创造的价值不只取决于亲自投入的时间。",book:"纳瓦尔宝典",author:"埃里克·乔根森 编",desc:"关于财富、判断力、杠杆与幸福的思考。"},
    {tag:"哲学 · 风险",title:"一个从不犯错的系统，为什么可能最危险？",passage:"如果所有小故障都被掩盖，一个系统看上去会非常稳定。但那些没有得到释放的压力，可能会在看不见的地方不断积累，最终带来更大的冲击。",summary:"不确定性未必只有坏处。有些系统能够在波动和压力中学习、调整，甚至变得更强。",book:"反脆弱",author:"纳西姆·尼古拉斯·塔勒布",desc:"重新理解风险、不确定性以及面对变化的能力。"},
    {tag:"习惯 · 成长",title:"为什么改变人生的，可能是每天微不足道的一件小事？",passage:"一次短短的阅读、一段五分钟的练习，今天未必看得出效果。但当它们成为生活中不需要反复做决定的习惯，就会逐渐积累出惊人的差异。",summary:"与其只靠意志力追求宏大的目标，不如设计一个更容易持续行动的系统。",book:"原子习惯",author:"詹姆斯·克利尔",desc:"从环境、行为反馈和微习惯入手，建立持续改变的机制。"},
    {tag:"历史 · 社会",title:"为什么陌生人能够共同相信同一个故事？",passage:"当大量不曾见面的人共同相信某种制度、符号或者观念时，他们就能够跨越熟人关系进行合作。许多看似理所当然的社会组织方式，都建立在这样的共同想象之上。",summary:"人类大规模协作的重要能力之一，是围绕共同认可的叙事建立秩序。",book:"人类简史",author:"尤瓦尔·赫拉利",desc:"从认知革命到现代社会，讨论人类如何发展出大规模合作。"},
    {tag:"思维 · 学习",title:"为什么越熟悉一个知识点，反而可能越高估自己？",passage:"当一个解释听起来流畅，我们常常把“听懂了”误当成“自己也能说清楚”。直到必须独立回答一个问题，才发现理解中存在许多空白。",summary:"真正的学习不仅是反复接触信息，还要主动提取、解释、检验自己的理解。",book:"认知天性",author:"彼得·布朗、亨利·罗迪格、马克·麦克丹尼尔",desc:"结合认知科学研究，介绍更有效的记忆与学习策略。"}
  ];
  const $ = id => document.getElementById(id);
  let current = 0, viewed = 1;
  let favorites = new Set();
  try { favorites = new Set(JSON.parse(localStorage.getItem("bookDiscoveryFavorites") || "[]")); } catch(e) {}
  const searchUrl = title => "https://www.google.com/search?q=" + encodeURIComponent(title + " 图书 正版阅读 试读");
  function render(){
    const b=books[current];
    $("tag").textContent=b.tag;$("count").textContent=String(current+1).padStart(2,"0")+" / "+String(books.length).padStart(2,"0");
    $("title").textContent=b.title;$("passage").textContent=b.passage;$("summary").textContent=b.summary;
    $("book-title").textContent="《"+b.book+"》";$("author").textContent=b.author;$("book-desc").textContent=b.desc;$("read-link").href=searchUrl(b.book);
    $("reveal").hidden=true;$("like").disabled=false;$("like").lastChild.textContent="感兴趣，看看是什么书";
    $("viewed").textContent="已探索 "+viewed+" 张卡片";
    $("progress").innerHTML=books.map((_,i)=>'<span class="dot '+(i===current?'active':'')+'"></span>').join("");
    const saved=favorites.has(current);$("save").setAttribute("aria-pressed",String(saved));$("save").firstChild.textContent=saved?"♥ 已收藏":"♡ 收藏这张卡片 ";$("saved-count").textContent=favorites.size?"("+favorites.size+")":"";
  }
  $("skip").addEventListener("click",()=>{const card=$("card");card.classList.add("swap");setTimeout(()=>{current=(current+1)%books.length;viewed++;render();card.classList.remove("swap")},120)});
  $("like").addEventListener("click",()=>{$("reveal").hidden=false;$("like").disabled=true;$("like").lastChild.textContent="已找到这本书";});
  $("save").addEventListener("click",()=>{if(favorites.has(current))favorites.delete(current);else favorites.add(current);try{localStorage.setItem("bookDiscoveryFavorites",JSON.stringify([...favorites]));}catch(e){}renderSave();});
  function renderSave(){const saved=favorites.has(current);$("save").setAttribute("aria-pressed",String(saved));$("save").firstChild.textContent=saved?"♥ 已收藏":"♡ 收藏这张卡片 ";$("saved-count").textContent=favorites.size?"("+favorites.size+")":"";}
  render();
</script>
</body>
</html>
